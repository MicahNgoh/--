<!DOCTYPE html>
<html>
<fieldset>
    <legend>Information</legend>
    <form>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" /><br />
        <label for="email">email</label>
        <input type="email" id="email" name="email" /><br />
        <label for="pass1">Password</label>
        <input type="password" id="pass1" name="Password" /><br />
        <label for="pass2">Condirm Password</label>
        <input type="password" id="pass2" name="Password" /><br />
        <label for="DOB">Date of Birth</label>
        <input type="date" id="DOB" name="DOB" /><br />
        Gender
        <label><input type="radio" name="Gender" value="Male" />Male</label>
        <label><input type="radio" name="Gender" value="Female" />Female</label><br />
        Hobbies
        <label><input type="checkbox" name="Hobby" value="Playing games" />Playing games</label>
        <label><input type="checkbox" name="Hobby" value="Reading" />Reading</label>
        <label><input type="checkbox" name="Hobby" value="Cooking" />Cooking</label>
        <label><input type="checkbox" name="Hobby" value="Coding" />Coding</label><br />
        <label for="Country">Country</label>
        <input type="text" name="Country" /><br />
        <label for="Bio">A short Bio</label><br />
        <textarea name="Bio" id="Bio">Type in here</textarea><br />
        <input type="submit" value="submit" />
        <input type="reset" value="reset" />
    </form>
</fieldset>

</html>
